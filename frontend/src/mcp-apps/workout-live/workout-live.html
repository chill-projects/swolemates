      button, select, input, textarea {
        font: inherit;

      /* Self-contained by design: apps get no external network unless the resource
         declares CSP domains. Everything inlines at build time. */
      :root {
        color-scheme: light dark;
        font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 14px;
        line-height: 1.5;
        /* Matches frontend/src/index.css's --ink exactly — this component is
           self-contained (no shared stylesheet with the SPA shell) but renders inside
           it via AppRenderer, so its body text needs to match the host's ink color, not
           fall back to the browser's default black. Same light/dark pair, kept in sync
           by hand. */
        --ink: #122a2e;
        --accent: #2f9e8f;
        --border: color-mix(in srgb, currentColor 14%, transparent);
        --field-border: color-mix(in srgb, currentColor 35%, transparent);
      }
      @media (prefers-color-scheme: dark) {
        :root { --ink: #f2ede1; }
      }
      body { margin: 0; padding: 0.85rem; color: var(--ink); }
      .muted { opacity: 0.65; }
      .error { color: #d33; }
      button {
        padding: 0.35rem 0.65rem; border: 1px solid var(--field-border);
        border-radius: 0.375rem; background: transparent; color: inherit; cursor: pointer;
        font-size: 0.8rem;
      }
      input[type="text"], input[type="number"] {
        padding: 0.3rem 0.4rem; border: 1px solid var(--field-border);
        border-radius: 0.375rem; background: transparent; color: inherit; font-size: 0.8rem;
      }

      #status { margin: 0 0 0.75rem; }
      /* :not([hidden]) — an ID/class selector's explicit `display` otherwise beats
         the `[hidden]` attribute's `display: none` on specificity, even though JS
         toggles `.hidden` to control visibility. */
      #empty:not([hidden]) { display: flex; flex-direction: column; align-items: flex-start; gap: 0.5rem; }

      #celebrations:not([hidden]) {
        display: flex; flex-direction: column; gap: 0.4rem; margin-bottom: 0.75rem;
      }
      .celebration {
        border: 1px solid var(--accent); border-radius: 0.5rem;
        padding: 0.5rem 0.7rem; font-size: 0.85rem;
      }
      #streak-line { margin: 0 0 0.75rem; }

      /* Live muscle map (Peloton-style "body activity", scoped to this session —
         see backend/app/mcp/workouts_tools.py's _muscle_coverage_payload). Front +
         back share one 1448x1448 canvas by construction (each view is a 724-wide
         half — see NOTICE-body-highlighter.md), so both <svg> viewBoxes just slice
         that shared coordinate space; no transform needed to lay them out side by
         side. `.body-base` (hair/head/hands/feet/ankles/knees/tibialis) is the fixed
         silhouette outline — never colored, just completes the figure. */
      #muscle-map { display: flex; justify-content: center; gap: 0.4rem; margin-bottom: 0.75rem; }
      #muscle-map svg { width: 48%; height: auto; max-width: 9rem; }
      #muscle-map .body-base path {
        fill: color-mix(in srgb, currentColor 12%, transparent); stroke: none;
      }
      #muscle-map .muscle path { stroke: none; transition: fill 0.2s ease; }
      #muscle-map .muscle[data-level="none"] path {
        fill: color-mix(in srgb, currentColor 18%, transparent);
      }
      #muscle-map .muscle[data-level="light"] path {
        fill: color-mix(in srgb, var(--accent) 35%, transparent);
      }
      #muscle-map .muscle[data-level="moderate"] path {
        fill: color-mix(in srgb, var(--accent) 65%, transparent);
      }
      #muscle-map .muscle[data-level="heavy"] path { fill: var(--accent); }

      .group {
        border: 1px solid var(--border); border-radius: 0.6rem;
        padding: 0.6rem; margin-bottom: 0.6rem;
      }
      .group-toggle {
        display: flex; align-items: center; gap: 0.4rem; width: 100%;
        border: none; padding: 0; background: none; color: inherit; text-align: left;
        font: inherit; font-weight: 600; cursor: pointer;
      }
      .group-toggle .group-count { margin-left: auto; font-weight: 400; }
      .badge {
        font-size: 0.65rem; font-weight: 400; border: 1px solid var(--field-border);
        border-radius: 999px; padding: 0.05rem 0.5rem; color: var(--accent);
      }
      .group-body:not([hidden]) { margin-top: 0.6rem; display: flex; flex-direction: column; gap: 0.9rem; }
      .superset-hint { font-size: 0.75rem; margin: 0; }
      hr { border: none; border-top: 1px solid var(--border); opacity: 0.6; margin: 0; }

      .exercise-header { display: flex; align-items: center; gap: 0.5rem; }
      .exercise-header strong { flex: 1; }
      .exercise-header button { padding: 0.15rem 0.5rem; font-size: 0.7rem; }
      .remove-x { padding: 0 0.35rem !important; }

      .last-time { font-size: 0.78rem; margin-top: 0.3rem; }
      .logged-sets { list-style: none; margin: 0.35rem 0 0; padding: 0; font-size: 0.8rem; }
      .logged-sets li { display: flex; align-items: center; gap: 0.3rem; padding: 0.15rem 0; opacity: 0.85; }
      .redo-set-btn {
        border: none; background: none; padding: 0.1rem; margin: 0; line-height: 0;
        color: var(--accent); opacity: 0.75; cursor: pointer;
      }
      .redo-set-btn:hover { opacity: 1; }
      .redo-set-btn svg { width: 0.85rem; height: 0.85rem; display: block; }
      .delete-set-btn {
        border: none; background: none; padding: 0.1rem; margin: 0 0 0 auto; line-height: 0;
        color: inherit; opacity: 0.45; cursor: pointer;
      }
      .delete-set-btn:hover { opacity: 0.9; }
      .delete-set-btn svg { width: 0.75rem; height: 0.75rem; display: block; }
      .set-delete-confirm { gap: 0.5rem !important; opacity: 1 !important; }
      .set-delete-confirm button { padding: 0.1rem 0.4rem; font-size: 0.72rem; }

      .draft-set { display: flex; align-items: center; gap: 0.4rem; margin-top: 0.4rem; }
      .draft-set input[type="number"] { width: 4rem; }
      .draft-set label { display: flex; align-items: center; gap: 0.25rem; font-size: 0.75rem; }
      .draft-set button { margin-left: auto; }

      .next-time-note { width: 100%; box-sizing: border-box; margin-top: 0.4rem; }

      #controls { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.5rem; }

      #picker:not([hidden]) {
        border: 1px solid var(--border); border-radius: 0.6rem; padding: 0.6rem;
        margin-top: 0.6rem; display: flex; flex-direction: column; gap: 0.5rem;
      }
      #picker-list { list-style: none; margin: 0; padding: 0; max-height: 12rem; overflow-y: auto; }
      #picker-list li { padding: 0.1rem 0; }
      .picker-group-label {
        font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.04em;
        opacity: 0.55; margin-top: 0.4rem;
      }
      #picker-list button { width: 100%; text-align: left; border: none; padding: 0.25rem 0.1rem; }

      #picker-filter-row { display: flex; gap: 0.4rem; }
      #picker-filter-row input[type="text"] { flex: 1; min-width: 0; }
      #picker-filter-toggle {
        flex: 0 0 auto; display: flex; align-items: center; gap: 0.3rem; font-size: 0.78rem;
      }
      #picker-filter-badge {
        background: var(--accent); color: #fff; border-radius: 999px; font-size: 0.65rem;
        font-weight: 700; padding: 0.05rem 0.4rem; line-height: 1.3;
      }
      #picker-drawer:not([hidden]) {
        border-top: 1px dashed var(--border); padding-top: 0.5rem;
        display: flex; flex-direction: column; gap: 0.5rem;
      }
      .picker-chip-group-label {
        font-size: 0.65rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em;
        opacity: 0.55; margin-bottom: 0.3rem;
      }
      .picker-chip-row { display: flex; flex-wrap: wrap; gap: 0.35rem; }
      .chip {
        border: 1px solid var(--field-border); border-radius: 999px; padding: 0.25rem 0.6rem;
        font-size: 0.75rem; background: transparent; color: inherit; cursor: pointer;
      }
      .chip[aria-pressed="true"] {
        background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600;
      }

      #activity-form:not([hidden]) {
        display: flex; flex-direction: column; gap: 0.5rem; width: 100%; max-width: 16rem;
        border: 1px solid var(--border); border-radius: 0.6rem; padding: 0.6rem; margin-top: 0.2rem;
      }
      #activity-form input[type="text"], #activity-form input[type="number"] {
        width: 100%; box-sizing: border-box;
      }
      #activity-form-controls { display: flex; gap: 0.5rem; }
    </style>

      <div id="picker" hidden>
        <div id="picker-filter-row">
          <input id="picker-filter" type="text" placeholder="Filter exercises…" aria-label="Filter exercises" />

          </div>
          <div>
            <div class="picker-chip-group-label">Equipment</div>
            <div id="picker-equipment-chips" class="picker-chip-row"></div>
          </div>
        </div>
        <ul id="picker-list"></ul>
        <button type="button" id="picker-cancel">Cancel</button>
      </div>

      <div id="controls">
        <button type="button" id="add-exercise-btn">+ Add exercise</button>
        <button type="button" id="finish-btn">Finish workout</button>
        <button type="button" id="cancel-btn" hidden>Cancel</button>
        <button type="button" id="back-btn" hidden>Back to start</button>
      </div>
