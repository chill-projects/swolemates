<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nutrition today</title>
    <style>
      /* Self-contained by design: apps get no external network unless the resource
         declares CSP domains. Everything inlines at build time. */
      :root {
        color-scheme: light dark;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 14px;
        line-height: 1.5;
        --ring-track: color-mix(in srgb, currentColor 12%, transparent);
        --ring-fill: #2f9e8f;
        --bar-track: color-mix(in srgb, currentColor 10%, transparent);
        --border: color-mix(in srgb, currentColor 14%, transparent);
      }
      body { margin: 0; padding: 0.85rem; }
      .hero { display: flex; align-items: center; gap: 1.25rem; margin-bottom: 1rem; }
      .ring-wrap { position: relative; width: 120px; height: 120px; flex-shrink: 0; }
      .ring-wrap svg { transform: rotate(-90deg); }
      .ring-center {
        position: absolute; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; text-align: center;
      }
      .ring-value { font-size: 1.4rem; font-weight: 600; line-height: 1; }
      .ring-target { font-size: 0.7rem; opacity: 0.65; margin-top: 0.15rem; }
      .ring-label {
        font-size: 0.6rem; letter-spacing: 0.04em; text-transform: uppercase;
        color: var(--ring-fill); margin-top: 0.2rem; font-weight: 600;
      }
      .bars { flex: 1; display: flex; flex-direction: column; gap: 0.6rem; min-width: 0; }
      .bar-row .top { display: flex; justify-content: space-between; align-items: baseline; }
      .bar-row .top .amount { opacity: 0.65; font-variant-numeric: tabular-nums; }
      .bar-track { height: 6px; border-radius: 999px; background: var(--bar-track); margin-top: 0.25rem; }
      .bar-fill { height: 100%; border-radius: 999px; background: var(--ring-fill); }
      .muted { opacity: 0.65; }
      .error { color: #d33; }
      section { border: 1px solid var(--border); border-radius: 0.75rem; padding: 0.75rem; }
      section + section { margin-top: 0.75rem; }
      h2 {
        font-size: 0.65rem; letter-spacing: 0.05em; text-transform: uppercase;
        opacity: 0.6; margin: 0 0 0.5rem;
      }
      ul { list-style: none; padding: 0; margin: 0; }
      li { padding: 0.45rem 0; border-bottom: 1px solid var(--border); }
      li:last-child { border-bottom: none; }
      .log-name { font-weight: 600; }
      .log-meta { opacity: 0.6; font-size: 0.75rem; }
      .log-values { opacity: 0.7; font-size: 0.8rem; margin-top: 0.15rem; }
      .log-top { display: flex; align-items: center; gap: 0.5rem; }

      .remaining-card { background: var(--ring-fill); color: #fff; border: none; }
      .remaining-card h2 { color: #fff; opacity: 0.85; }
      .remaining-grid { display: flex; gap: 1.1rem; flex-wrap: wrap; margin-bottom: 0.6rem; }
      .remaining-item .n { font-family: ui-serif, Georgia, serif; font-size: 1.35rem; font-weight: 600; }
      .remaining-item .l { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.05em; opacity: 0.8; margin-top: 0.1rem; }
      .remaining-tip {
        background: rgba(255, 255, 255, 0.15); border-radius: 0.6rem; padding: 0.55rem 0.7rem;
        font-size: 0.78rem; line-height: 1.5; border-left: 3px solid #ff6f59;
      }
      .remaining-tip b { font-weight: 600; }

      #templates { display: flex; gap: 0.6rem; overflow-x: auto; padding-bottom: 0.2rem; }
      .template-card {
        flex: 0 0 auto; min-width: 9.5rem; border: 1px solid var(--border);
        border-radius: 0.6rem; padding: 0.6rem;
      }
      .template-total { font-size: 1.15rem; font-weight: 600; margin: 0.15rem 0; }
      .template-macros { font-size: 0.7rem; }
      .template-actions { display: flex; gap: 0.4rem; margin-top: 0.5rem; }
      .template-items { margin-top: 0.5rem; font-size: 0.75rem; }
      .template-items li { padding: 0.3rem 0; border: none; }
      .template-item-view {
        display: flex; align-items: center; justify-content: space-between; gap: 0.5rem;
        opacity: 0.75;
      }
      .template-item-view button { padding: 0.15rem 0.4rem; font-size: 0.7rem; }
      .template-item-edit { margin-top: 0.3rem; display: flex; flex-direction: column; gap: 0.4rem; }
      .template-item-edit input[type="text"] {
        padding: 0.3rem 0.4rem; border: 1px solid color-mix(in srgb, currentColor 35%, transparent);
        border-radius: 0.375rem; background: transparent; color: inherit; font-size: 0.75rem;
      }
      .template-item-values { display: flex; flex-wrap: wrap; gap: 0.5rem; }
      .template-item-values label { display: flex; flex-direction: column; font-size: 0.65rem; opacity: 0.75; gap: 0.15rem; }
      .template-item-values input {
        width: 4.5rem; padding: 0.25rem 0.35rem; border: 1px solid color-mix(in srgb, currentColor 35%, transparent);
        border-radius: 0.375rem; background: transparent; color: inherit; font-size: 0.75rem;
      }
      .template-item-edit-actions { display: flex; gap: 0.4rem; }
      .template-item-edit-actions button { padding: 0.25rem 0.55rem; font-size: 0.7rem; }

      .group-toggle {
        display: block; width: 100%; text-align: left;
        border: none; background: none; color: inherit; padding: 0; cursor: pointer;
        font: inherit; font-weight: 600;
      }
      .grouped-log-items { margin-top: 0.35rem; padding-left: 1.1rem; font-size: 0.75rem; opacity: 0.8; }
      .grouped-log-items li { padding: 0.15rem 0; border: none; }

      #save-template-bar { display: flex; gap: 0.5rem; margin-top: 0.6rem; }
      #save-template-bar input {
        flex: 1; padding: 0.4rem 0.5rem; border: 1px solid color-mix(in srgb, currentColor 35%, transparent);
        border-radius: 0.375rem; background: transparent; color: inherit;
      }
      button {
        padding: 0.35rem 0.65rem; border: 1px solid color-mix(in srgb, currentColor 35%, transparent);
        border-radius: 0.375rem; background: transparent; color: inherit; cursor: pointer;
        font-size: 0.8rem;
      }
    </style>
  </head>
  <body>
    <div class="hero">
      <div class="ring-wrap">
        <svg width="120" height="120" viewBox="0 0 120 120">
          <circle cx="60" cy="60" r="52" fill="none" stroke="var(--ring-track)" stroke-width="12" />
          <circle
            id="ring-fill"
            cx="60" cy="60" r="52" fill="none" stroke="var(--ring-fill)" stroke-width="12"
            stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="326.7"
          />
        </svg>
        <div class="ring-center">
          <span id="ring-value" class="ring-value">0</span>
          <span id="ring-target" class="ring-target"></span>
          <span class="ring-label">Calories</span>
        </div>
      </div>
      <div id="bars" class="bars"></div>
    </div>

    <p id="status" class="muted">Connecting…</p>

    <section class="remaining-card">
      <h2>You have left today</h2>
      <div id="remaining-grid" class="remaining-grid"></div>
      <div id="remaining-tip" class="remaining-tip"></div>
    </section>

    <section>
      <h2>Meal templates</h2>
      <div id="templates"></div>
    </section>

    <section>
      <h2>Today's log</h2>
      <ul id="logs"></ul>
      <!-- Deliberately not window.prompt(): the iframe is sandboxed without
           allow-modals, where prompt()/alert()/confirm() are silently unusable. -->
      <div id="save-template-bar" hidden>
        <input id="template-name" type="text" placeholder="Template name" aria-label="Template name" />
        <button type="button" id="save-template-btn">Save as template</button>
      </div>
    </section>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
