<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Planned workouts</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 14px;
        line-height: 1.5;
        --accent: #2f9e8f;
        --border: color-mix(in srgb, currentColor 14%, transparent);
        --field-border: color-mix(in srgb, currentColor 35%, transparent);
      }
      body { margin: 0; padding: 0.85rem; }
      .muted { opacity: 0.65; }
      .error { color: #d33; }
      h2 {
        font-size: 0.65rem; letter-spacing: 0.05em; text-transform: uppercase;
        opacity: 0.6; margin: 0 0 0.5rem;
      }
      section { margin-bottom: 1rem; }
      button {
        padding: 0.35rem 0.65rem; border: 1px solid var(--field-border);
        border-radius: 0.375rem; background: transparent; color: inherit; cursor: pointer;
        font-size: 0.8rem;
      }
      select {
        padding: 0.3rem 0.4rem; border: 1px solid var(--field-border);
        border-radius: 0.375rem; background: transparent; color: inherit; font-size: 0.8rem;
      }

      #status { margin: 0 0 0.75rem; }

      .pattern-row {
        display: flex; align-items: center; justify-content: space-between;
        gap: 0.5rem; padding: 0.3rem 0;
      }
      .pattern-row select { flex: 1; max-width: 12rem; }

      #planned-list { list-style: none; margin: 0; padding: 0; }
      .planned-entry {
        border: 1px solid var(--border); border-radius: 0.6rem;
        padding: 0.6rem; margin-bottom: 0.5rem;
      }
      .planned-header { display: flex; align-items: center; gap: 0.5rem; }
      .planned-date { font-size: 0.75rem; opacity: 0.7; min-width: 4.5rem; }
      .planned-header strong { flex: 1; }
      .badge {
        font-size: 0.65rem; border: 1px solid var(--field-border);
        border-radius: 999px; padding: 0.05rem 0.5rem;
      }
      .badge.status-planned { color: var(--accent); }
      .badge.status-done { color: var(--accent); opacity: 0.7; }
      .badge.status-skipped { opacity: 0.5; }
      .planned-exercises { font-size: 0.78rem; margin-top: 0.3rem; }
      .planned-actions { display: flex; gap: 0.4rem; margin-top: 0.5rem; }
    </style>
  </head>
  <body>
    <p id="status" class="muted">Connecting…</p>

    <section>
      <h2>Weekly pattern</h2>
      <div id="pattern-days"></div>
    </section>

    <section>
      <h2>Coming up</h2>
      <ul id="planned-list"></ul>
    </section>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
