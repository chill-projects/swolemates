<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TmpX</title>
    <style>
      /* Self-contained by design: apps get no external network unless the resource
         declares CSP domains. Everything inlines at build time. */
      :root {
        color-scheme: light dark;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 14px;
        line-height: 1.5;
      }
      body { margin: 0; padding: 0.75rem; }
      #add-form { display: flex; gap: 0.5rem; margin-bottom: 0.5rem; }
      input {
        padding: 0.4rem 0.5rem; border: 1px solid color-mix(in srgb, currentColor 35%, transparent);
        border-radius: 0.375rem; background: transparent; color: inherit; min-width: 0;
      }
      input[type="number"] { width: 5rem; }
      button {
        padding: 0.4rem 0.75rem; border: 1px solid color-mix(in srgb, currentColor 35%, transparent);
        border-radius: 0.375rem; background: transparent; color: inherit; cursor: pointer;
      }
      button:disabled { opacity: 0.5; cursor: default; }
      ul { list-style: none; padding: 0; margin: 0; }
      li {
        display: flex; justify-content: space-between; align-items: center; gap: 0.75rem;
        padding: 0.4rem 0; border-bottom: 1px solid color-mix(in srgb, currentColor 12%, transparent);
      }
      .muted { opacity: 0.65; }
      .error { color: #d33; }
    </style>
  </head>
  <body>
    <!-- Deliberately not a <form>: app iframes run sandboxed without allow-forms,
         where submit events silently never fire. Plain buttons + keydown instead. -->
    <div id="add-form">
      <input id="name" placeholder="Item name" aria-label="Item name" style="flex: 1" />
      <input id="value" type="number" value="0" aria-label="Value" />
      <button type="button" id="add-btn">Add</button>
      <button type="button" id="refresh-btn" aria-label="Refresh" title="Refresh">↻</button>
    </div>
    <p id="status" class="muted">Connecting…</p>
    <ul id="items"></ul>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
